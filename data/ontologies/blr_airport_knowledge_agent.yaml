key: blr_airport_knowledge_agent
name: BLR Airport Knowledge Agent Ontology
description: An ontology for an airport customer-support knowledge agent covering
  airport services, terminals, airlines, flights, contacts, and support guidance at
  Bangalore International Airport Limited (BLR).
entity_types:
  airport:
    id_rule: Use the airport/operator name as written; no special code observed.
    examples:
    - Bangalore International Airport Limited
    - BLR Airport
    - Kempegowda International Airport Bengaluru
  terminal:
    id_rule: Use the terminal label as written, including terminal number and any
      zone/level qualifiers when present.
    examples:
    - Terminal 1
    - Terminal 2
    - Terminal T1
  airline:
    id_rule: Use the airline name as written; no code rule observed beyond airline
      names in text.
    examples:
    - Lufthansa
    - SpiceJet
    - Air India Express
  flight:
    id_rule: 'Flight number format when present: ^[A-Z]{1,3}\d{1,4}$'
    examples:
    - SG205
    - IX2718
  service:
    id_rule: Use the service name as written; no formal code observed.
    examples:
    - Porter Service
    - EZPass by BLR
    - 080 Transit Hotel
  support_channel:
    id_rule: Use the channel label or contact value as written.
    examples:
    - 080-66785555
    - +91-8884998888
    - feedback@bialairport.com
  location_zone:
    id_rule: Use the zone/location phrase as written; no formal code observed.
    examples:
    - Terminal 1 - Zone D
    - Terminal 2 - International Departures
    - Terminal 1 - Kerbside / Check-in / Baggage Claim support
  passenger_group:
    id_rule: Use the group label as written; no formal code observed.
    examples:
    - visitors
    - senior citizens
    - passengers with reduced mobility
  policy_or_requirement:
    id_rule: Use the policy phrase as written; no formal code observed.
    examples:
    - booking is available only after web check-in
    - bookings are not permitted within 75 minutes of departure
    - request should be placed at the time of booking or at least 48 hours before
      travel
  reference_link:
    id_rule: Use the URL as written.
    examples:
    - https://www.bengaluruairport.com/travellers/contact-us
    - https://www.bengaluruairport.com/travellers/flights/airline-partners-information
    - https://www.bengaluruairport.com/travellers/services/special-assistance/buggy-service
  amenity:
    id_rule: Use the amenity phrase as written; no formal code observed.
    examples:
    - complimentary WiFi
    - water, tea and coffee
    - bathroom and shower amenities
allowed_triples:
- - airline
  - operates_from
  - terminal
- - airport
  - offers_service
  - service
- - airport
  - operates_terminal
  - terminal
- - airport
  - provides_support_channel
  - support_channel
- - flight
  - has_location_zone
  - location_zone
- - flight
  - has_status
  - policy_or_requirement
- - flight
  - operated_by
  - airline
- - passenger_group
  - eligible_for
  - service
- - passenger_group
  - subject_to
  - policy_or_requirement
- - service
  - available_in_zone
  - location_zone
- - service
  - has_amenity
  - amenity
- - service
  - has_reference
  - reference_link
- - service
  - has_requirement
  - policy_or_requirement
- - service
  - located_in
  - terminal
- - support_channel
  - supports
  - airport
- - support_channel
  - supports
  - service
- - terminal
  - contains_location_zone
  - location_zone
- - terminal
  - contains_service
  - service
open_relations: false
normalization:
  strip_type_prefixes: true
  collapse_whitespace: true
  id_transforms:
  - pattern: ^\s+|\s+$
    replace: ''
    case: ''
    note: trim leading and trailing whitespace
  - pattern: _x000D_
    replace: ' '
    case: ''
    note: remove spreadsheet line-break artifacts
  - pattern: \s+
    replace: ' '
    case: ''
    note: collapse repeated whitespace
  - pattern: ^https?://
    replace: https://
    case: ''
    note: normalize URL scheme to https where possible
  rules_text:
  - Treat Terminal 1, T1, and Terminal T1 as the same terminal only when the surrounding
    text clearly indicates BLR terminal naming.
  - Preserve quoted zone strings exactly, because the sample uses many distinct zone/location
    phrasings.
  - Keep flight numbers and airline names as written; do not infer missing carrier
    codes or routes.
  - Treat phone numbers, WhatsApp numbers, and email addresses as support channels
    rather than generic contacts.
  - Do not merge services that are only loosely related, such as transit hotel, lounge,
    buggy service, porter service, and EZPass.
custom_prompt: ''
actions: []
